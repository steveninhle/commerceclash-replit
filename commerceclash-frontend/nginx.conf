server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed JS/CSS/images — cache aggressively (Vite fingerprints these)
    location ~* \.(js|css|woff2|woff|ttf|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html — never cache (must always be fresh so new deploys take effect)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss application/font-woff2 image/svg+xml;
    gzip_min_length 256;
}
